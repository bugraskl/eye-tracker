name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# One run per branch / pull request; a newer push cancels the older run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FORCE_COLOR: "1"
  PYTHONUTF8: "1"
  # Qt runs headless everywhere; no display server is needed.
  QT_QPA_PLATFORM: offscreen
  UV_NO_PROGRESS: "1"

jobs:
  lint:
    name: Lint, types and privacy
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Ruff (lint)
        run: uv run --no-sync ruff check --output-format=github .

      - name: Ruff (format)
        run: uv run --no-sync ruff format --check --diff .

      - name: Mypy (package)
        run: uv run --no-sync mypy

      - name: Mypy (build scripts)
        run: uv run --no-sync mypy scripts packaging/pyinstaller/entry.py

      - name: Privacy check (no network code, no frames written)
        run: uv run --no-sync python scripts/check_privacy.py

      - name: Verify the bundled face models
        run: uv run --no-sync python scripts/fetch_models.py --check

      - name: Check packaging scripts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends desktop-file-utils shellcheck
          shellcheck packaging/linux/build_appimage.sh packaging/linux/AppRun packaging/macos/make_dmg.sh
          desktop-file-validate packaging/linux/eye-tracker.desktop

  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - windows-latest
          - macos-latest
        python:
          - "3.12"
        include:
          - os: ubuntu-24.04
            python: "3.11"
          - os: ubuntu-24.04
            python: "3.13"
    steps:
      - name: Check out
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Install Qt runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 libglib2.0-0

      - name: Set up uv and Python ${{ matrix.python }}
        uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Run the tests
        run: uv run --no-sync pytest -q --durations=15
