name: Bundle

# Builds the frozen bundles exactly like release.yml does and runs the same bundle
# privacy gate and a short smoke test, whenever something that decides what goes
# into them changes (the spec, the gate, the dependencies). A problem that would
# fail a release, such as a new networking library pulled in by a dependency
# update, then shows up on the pull request instead of after a tag is pushed.
# Nothing is published or uploaded.
on:
  pull_request:
    paths:
      - "packaging/**"
      - "scripts/check_privacy.py"
      - "scripts/fetch_models.py"
      - "scripts/make_icons.py"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/bundle.yml"
  push:
    branches:
      - main
    paths:
      - "packaging/**"
      - "scripts/check_privacy.py"
      - "scripts/fetch_models.py"
      - "scripts/make_icons.py"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/bundle.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FORCE_COLOR: "1"
  PYTHONUTF8: "1"
  PYTHON_VERSION: "3.12"
  UV_PYTHON_DOWNLOADS: never
  UV_NO_PROGRESS: "1"
  QT_QPA_PLATFORM: offscreen
  # Same value as in release.yml (see the comment there).
  MACOS_MINIMUM: "14.0"

jobs:
  bundle:
    name: Bundle (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # The same runners as the release builds.
          - os: windows-latest
            bundle: dist/EyeTracker
            cli: dist/EyeTracker/eye-tracker-cli.exe
          - os: macos-14
            bundle: dist/Eye Tracker.app
            cli: dist/Eye Tracker.app/Contents/MacOS/eye-tracker-cli
          - os: ubuntu-22.04
            bundle: dist/eye-tracker
            cli: dist/eye-tracker/eye-tracker
    defaults:
      run:
        shell: bash
    env:
      BUNDLE: ${{ matrix.bundle }}
      CLI: ${{ matrix.cli }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install system libraries
        if: runner.os == 'Linux'
        # Identical to build-linux in release.yml, so the same libraries are bundled.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libfontconfig1 libdbus-1-3 \
            libglib2.0-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xfixes0 libxcb-xinerama0 \
            libxcb-xkb1 libx11-xcb1 libsm6 libice6 desktop-file-utils

      - name: Set up Python
        id: python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --python "${{ steps.python.outputs.python-path }}"

      - name: Verify the face models
        run: uv run --no-sync python scripts/fetch_models.py --check

      - name: Render the icons
        run: uv run --no-sync python scripts/make_icons.py

      - name: Build with PyInstaller
        run: uv run --no-sync pyinstaller packaging/pyinstaller/eye-tracker.spec --noconfirm --clean

      - name: Check that no GTK or GIO libraries were bundled
        if: runner.os == 'Linux'
        run: |
          if find "$BUNDLE" \( -name 'libgtk-3.so*' -o -name 'libgio-2.0.so*' \
              -o -name 'libqgtk3.so' \) | grep .; then
            echo "::error::the bundle contains GTK or GIO libraries"
            exit 1
          fi

      - name: Privacy gate for the bundle (no telemetry, no unexpected networking code)
        run: uv run --no-sync python scripts/check_privacy.py --bundle "$BUNDLE"

      - name: Check the minimum macOS version
        if: runner.os == 'macOS'
        run: |
          minimum="$(plutil -extract LSMinimumSystemVersion raw "$BUNDLE/Contents/Info.plist")"
          if [[ "$minimum" != "$MACOS_MINIMUM" ]]; then
            echo "::error::LSMinimumSystemVersion is $minimum, but MACOS_MINIMUM (and the README, docs and release notes) say $MACOS_MINIMUM"
            exit 1
          fi

      - name: Smoke-test the frozen CLI
        run: |
          set -euo pipefail
          cfg="$RUNNER_TEMP/eye-tracker-smoke"
          clips="$RUNNER_TEMP/eye-tracker-clips"
          "$CLI" --version
          "$CLI" --config-dir "$cfg" doctor --json > doctor.json
          "$CLI" --config-dir "$cfg" bench --camera packaging/linux/eye-tracker.png \
            --seconds 1 --json > bench.json
          # Video files are read by the bundled FFmpeg. The test clips are written with
          # the build environment's OpenCV: an AVI by OpenCV's own MJPEG encoder and an
          # MP4 (MPEG-4 Part 2) by FFmpeg.
          uv run --no-sync python - "$clips" <<'PY'
          import sys
          from pathlib import Path

          import cv2
          import numpy as np

          clips = Path(sys.argv[1])
          clips.mkdir(parents=True, exist_ok=True)
          for name, api, codec in (
              ("clip.avi", cv2.CAP_OPENCV_MJPEG, "MJPG"),
              ("clip.mp4", cv2.CAP_FFMPEG, "mp4v"),
          ):
              fourcc = cv2.VideoWriter.fourcc(*codec)
              writer = cv2.VideoWriter(str(clips / name), api, fourcc, 10.0, (160, 120))
              assert writer.isOpened(), name
              for level in range(0, 250, 25):
                  writer.write(np.full((120, 160, 3), level, np.uint8))
              writer.release()
          PY
          for clip in clip.avi clip.mp4; do
            "$CLI" --config-dir "$cfg" bench --camera "$clips/$clip" --seconds 1 --json \
              > "bench-$clip.json"
          done
          # The runners have no camera, but probing runs each platform's capture backend
          # (AVFoundation on macOS) inside the bundle.
          "$CLI" --config-dir "$cfg" doctor --probe-cameras --json > probe.json 2> probe.err
          uv run --no-sync python - <<'PY'
          import json
          import sys

          report = json.load(open("doctor.json", encoding="utf-8"))
          assert report["app"]["frozen"] is True, report["app"]
          for name, model in report["backends"]["models"].items():
              assert model.get("present") and model.get("sha256_ok"), (name, model)
          bench = json.load(open("bench.json", encoding="utf-8"))
          assert bench["modes"]["max"]["analysed"] > 0, bench["modes"]
          for clip in ("clip.avi", "clip.mp4"):
              video = json.load(open(f"bench-{clip}.json", encoding="utf-8"))
              assert video["device"] == f"file {clip}", video
              assert video["frame_size"] == [160, 120], video
              assert video["modes"]["max"]["analysed"] > 0, video["modes"]
          cameras = json.load(open("probe.json", encoding="utf-8"))["cameras"]
          assert cameras["probed"] is True, cameras
          assert isinstance(cameras["devices"], list), cameras
          if sys.platform == "darwin" and not cameras["devices"]:
              # Printed by OpenCV's AVFoundation backend for each camera it cannot open.
              errors = open("probe.err", encoding="utf-8").read()
              assert "OpenCV: camera failed to properly initialize!" in errors, errors
          print("smoke test passed")
          PY
